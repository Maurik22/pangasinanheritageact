name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source-code/pangasinan-heritage/package-lock.json
      - name: Install packages
        working-directory: source-code/pangasinan-heritage
        run: npm ci
      - name: Build static website
        working-directory: source-code/pangasinan-heritage
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: source-code/pangasinan-heritage/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
